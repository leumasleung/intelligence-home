<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eason 陳奕迅《Recording Sessions》26場全曲庫夫妻選場決策器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
    .rate-btn { transition: all 0.12s ease; }
    .rate-btn:active { transform: scale(0.92); }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 28px; height: 28px; border-radius: 50%;
      background: #ec4899; cursor: pointer; border: 3px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen text-base sm:text-lg pb-32">

  <!-- 頂部導航列 -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3.5 shadow-xl">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center text-white shadow-lg shrink-0">
          <i class="fa-solid fa-record-vinyl text-2xl animate-spin" style="animation-duration: 10s;"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-2xl font-black text-white leading-tight">Eason 2026-2027 錄音會選場器</h1>
          <p class="text-xs sm:text-sm text-slate-400 font-medium">官方 26 場 · 303 首完整曲目核對版</p>
        </div>
      </div>
      
      <!-- 頂部功能按鈕組 -->
      <div class="flex items-center gap-2">
        <button type="button" onclick="toggleScoreConfigPanel()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs sm:text-sm text-amber-300 flex items-center gap-1.5 border border-slate-700 font-bold active:scale-95 transition">
          <i class="fa-solid fa-sliders"></i>
          <span>分數設定</span>
        </button>
        <button type="button" onclick="openImportModal()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs sm:text-sm text-slate-200 flex items-center gap-1.5 border border-slate-700 font-bold active:scale-95 transition">
          <i class="fa-solid fa-file-import text-sky-400"></i>
          <span>貼上代碼</span>
        </button>
        <button type="button" onclick="openShareModal()" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs sm:text-sm font-bold text-white flex items-center gap-1.5 shadow-md active:scale-95 transition">
          <i class="fa-brands fa-whatsapp text-base sm:text-lg"></i>
          <span>WhatsApp 接力</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

    <!-- 可折疊：自訂分數權重面板 (神曲/好聽/普通/唔識) -->
    <section id="scoreConfigPanel" class="hidden bg-slate-900 border-2 border-amber-500/40 rounded-3xl p-5 sm:p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2 text-base sm:text-lg font-black text-amber-400">
          <i class="fa-solid fa-Calculator"></i>
          <span>自訂各等級分數權重（預設：8 / 6 / 3 / 1）</span>
        </div>
        <button type="button" onclick="resetScoreConfig()" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 font-bold border border-slate-700">
          還原預設 (8/6/3/1)
        </button>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
        <div class="bg-slate-950 p-3.5 rounded-2xl border border-amber-500/30">
          <label class="block text-xs sm:text-sm font-bold text-amber-400 mb-1">🔥 [神曲] 分數</label>
          <input type="number" id="cfg-god" step="0.5" oninput="updateScoreConfig()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-lg font-black text-white focus:border-amber-400 focus:outline-none">
        </div>
        <div class="bg-slate-950 p-3.5 rounded-2xl border border-emerald-500/30">
          <label class="block text-xs sm:text-sm font-bold text-emerald-400 mb-1">💖 [好聽] 分數</label>
          <input type="number" id="cfg-good" step="0.5" oninput="updateScoreConfig()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-lg font-black text-white focus:border-emerald-400 focus:outline-none">
        </div>
        <div class="bg-slate-950 p-3.5 rounded-2xl border border-sky-500/30">
          <label class="block text-xs sm:text-sm font-bold text-sky-400 mb-1">☕ [普通] 分數</label>
          <input type="number" id="cfg-normal" step="0.5" oninput="updateScoreConfig()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-lg font-black text-white focus:border-sky-400 focus:outline-none">
        </div>
        <div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-600/40">
          <label class="block text-xs sm:text-sm font-bold text-slate-400 mb-1">❓ [唔識] 分數</label>
          <input type="number" id="cfg-unknown" step="0.5" oninput="updateScoreConfig()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-lg font-black text-white focus:border-slate-400 focus:outline-none">
        </div>
      </div>
      <p class="text-xs sm:text-sm text-slate-400">
        💡 提示：你亦可在 HTML 檔案頂部 `<script>` 的 `DEFAULT_SCORE_CONFIG` 直接修改預設數值。
      </p>
    </section>

    <!-- 夫妻話事權重調配板 -->
    <section class="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 shadow-md space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 text-base sm:text-lg font-black text-white">
          <i class="fa-solid fa-scale-balanced text-amber-400 text-xl"></i>
          <span>夫妻話事權重調配</span>
        </div>
        <div class="flex flex-wrap items-center gap-1.5 bg-slate-950 p-1.5 rounded-2xl text-xs sm:text-sm font-bold border border-slate-800">
          <button type="button" id="preset-50" onclick="setWeightPreset(50)" class="px-3 py-1.5 rounded-xl transition">平權 50:50</button>
          <button type="button" id="preset-70" onclick="setWeightPreset(70)" class="px-3 py-1.5 rounded-xl transition">求生欲 70:30</button>
          <button type="button" id="preset-100" onclick="setWeightPreset(100)" class="px-3 py-1.5 rounded-xl transition">老婆全權 100%</button>
          <button type="button" id="preset-20" onclick="setWeightPreset(20)" class="px-3 py-1.5 rounded-xl transition">老公話事 80%</button>
        </div>
      </div>

      <div class="space-y-2.5 pt-1">
        <div class="flex justify-between items-center text-sm sm:text-base font-bold">
          <span class="text-blue-400 flex items-center gap-1.5">
            <i class="fa-solid fa-mars text-lg"></i> 老公佔比: <span id="husbandWeightText" class="text-xl font-black">30</span>%
          </span>
          <span class="text-pink-400 flex items-center gap-1.5">
            <i class="fa-solid fa-venus text-lg"></i> 老婆佔比: <span id="wifeWeightText" class="text-xl font-black">70</span>%
          </span>
        </div>
        <input id="weightSlider" type="range" min="0" max="100" value="70" oninput="updateWeight(this.value)"
               class="w-full h-3 bg-slate-800 rounded-lg appearance-none cursor-pointer slider">
        <div class="flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm text-slate-400 pt-1">
          <span id="currentScoreRuleBadge" class="font-semibold text-slate-300">目前計分：🔥神曲=8分 · 💖好聽=6分 · ☕普通=3分 · ❓唔識=1分</span>
          <span>點擊每首歌按鈕即可打分，再點一次可取消</span>
        </div>
      </div>
    </section>

    <!-- Top 10 首選推薦榜 -->
    <section class="bg-gradient-to-br from-indigo-950/70 via-slate-900 to-slate-900 border-2 border-indigo-900/60 rounded-3xl p-5 sm:p-6 shadow-xl space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-indigo-900/40 pb-3.5">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-trophy text-amber-400 text-xl"></i>
          <h2 class="text-base sm:text-xl font-black text-indigo-200">當前最佳場次推薦 Top 10</h2>
          <span class="text-xs sm:text-sm font-bold px-2.5 py-0.5 rounded-full bg-indigo-900/70 text-indigo-300" id="totalRatedCount">已評 0 / 26 場</span>
        </div>

        <!-- 排序方式切換 -->
        <div class="flex items-center gap-1.5 bg-slate-950/90 p-1 rounded-xl border border-slate-800 text-xs sm:text-sm font-bold self-start sm:self-auto">
          <button type="button" id="sort-total-btn" onclick="setSortMode('total')" class="px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 transition">
            按加權總分 (神曲多優先)
          </button>
          <button type="button" id="sort-avg-btn" onclick="setSortMode('avg')" class="px-3 py-1.5 rounded-lg text-slate-300 hover:bg-slate-800 transition">
            按單曲均分 (全碟精準度)
          </button>
        </div>
      </div>
      
      <div id="topRecommendations" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
        <!-- 動態渲染 Top 10 -->
      </div>
    </section>

    <!-- 搜尋與場次月份過濾 -->
    <section class="space-y-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-base"></i>
        <input type="text" id="songSearchInput" oninput="handleSearch(this.value)"
               placeholder="🔍 搜尋歌名、專輯或日期（例如：陀飛輪、浮誇、1874、苦瓜、十年、平安夜）..."
               class="w-full pl-11 pr-12 py-3.5 bg-slate-900 border border-slate-800 rounded-2xl text-base text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition shadow-inner">
        <button type="button" id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- 月份與狀態分類標籤 -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 custom-scroll text-sm sm:text-base font-bold">
        <button type="button" onclick="filterMonth('all')" id="tab-all" class="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 shrink-0 shadow-md">全部 26 場</button>
        <button type="button" onclick="filterMonth('2026-12')" id="tab-2026-12" class="px-4 py-2 rounded-xl bg-slate-900 text-slate-300 hover:bg-slate-800 shrink-0 border border-slate-800">2026年12月 (10場)</button>
        <button type="button" onclick="filterMonth('2027-01')" id="tab-2027-01" class="px-4 py-2 rounded-xl bg-slate-900 text-slate-300 hover:bg-slate-800 shrink-0 border border-slate-800">2027年1月 (10場)</button>
        <button type="button" onclick="filterMonth('2027-02')" id="tab-2027-02" class="px-4 py-2 rounded-xl bg-slate-900 text-slate-300 hover:bg-slate-800 shrink-0 border border-slate-800">2027年2月 (6場)</button>
        <button type="button" onclick="filterMonth('rated')" id="tab-rated" class="px-4 py-2 rounded-xl bg-slate-900 text-emerald-400 hover:bg-slate-800 shrink-0 border border-slate-800">✨ 已評分場次</button>
      </div>
    </section>

    <!-- 專輯場次列表標題與展開控制 -->
    <div class="flex flex-wrap items-center justify-between gap-2 pt-2">
      <h2 class="text-lg sm:text-xl font-black text-white flex items-center gap-2">
        <i class="fa-solid fa-list-check text-rose-400"></i> 26 場官方專輯與全曲目打分表
      </h2>
      <div class="flex items-center gap-2 text-xs sm:text-sm font-bold">
        <button type="button" onclick="toggleAllTracks(true)" class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-amber-400 transition">全部展開歌單</button>
        <button type="button" onclick="toggleAllTracks(false)" class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-amber-400 transition">全部收起歌單</button>
      </div>
    </div>

    <!-- 26 場卡片容器 -->
    <div id="albumListContainer" class="space-y-5"></div>

    <!-- 底部存檔與管理工具列 -->
    <section class="p-5 rounded-3xl bg-slate-900/90 border border-slate-800 flex flex-wrap items-center justify-between gap-4 text-xs sm:text-sm text-slate-400">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-floppy-disk text-emerald-400 text-base"></i>
        <span>所有打分已自動儲存於本機瀏覽器</span>
      </div>
      <div class="flex flex-wrap items-center gap-2 font-bold">
        <button type="button" onclick="loadDemoData()" class="px-3.5 py-2 rounded-xl bg-indigo-950/80 border border-indigo-700/60 text-indigo-300 hover:bg-indigo-900 transition">
          <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>載入測試數據
        </button>
        <button type="button" onclick="exportJSONFile()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          <i class="fa-solid fa-download mr-1"></i>下載備份檔
        </button>
        <button type="button" onclick="resetAllData()" class="px-3.5 py-2 rounded-xl bg-rose-950/70 border border-rose-800/70 text-rose-300 hover:bg-rose-900 transition">
          <i class="fa-regular fa-trash-can mr-1"></i>清空重置
        </button>
      </div>
    </section>

  </main>

  <!-- 彈出視窗：WhatsApp 接力分享 & 代碼匯入 -->
  <div id="syncModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-slate-700 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="modalTitle" class="text-lg sm:text-xl font-black text-white flex items-center gap-2"></h3>
        <button type="button" onclick="closeModal()" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <p id="modalDesc" class="text-xs sm:text-sm text-slate-300 leading-relaxed"></p>
      <textarea id="modalTextarea" rows="5" class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-3.5 text-xs sm:text-sm text-amber-300 font-mono focus:outline-none focus:border-amber-500"></textarea>
      <div id="modalActions" class="flex flex-wrap items-center justify-end gap-2.5 pt-2"></div>
    </div>
  </div>

  <!-- 輕量提示 Toast -->
  <div id="toastBox" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden px-5 py-3 rounded-2xl bg-emerald-600 text-white font-bold text-sm sm:text-base shadow-2xl flex items-center gap-2">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastText">操作成功</span>
  </div>

  <script>
    // =========================================================================
    // 【1. 自訂分數權重設定】可直接在此 HTML Code 修改預設分值，或在網頁「分數設定」修改
    // =========================================================================

      god: 8,      // [神曲] 預設分數
      good: 6,     // [好聽] 預設分數
      normal: 3,   // [普通] 預設分數

    // 評分選項定義
    const RATING_LEVELS = [
      { key: 'god',     label: '神曲', icon: '🔥', activeHus: 'bg-amber-500 text-slate-950 border-amber-300 font-black shadow-md', activeWife: 'bg-amber-500 text-slate-950 border-amber-300 font-black shadow-md' },

    // =========================================================================
    // 【3. 全局應用程式狀態與初始化】
    // =========================================================================
    const STORAGE_KEY = 'eason_recording_26_verified_v5';
    let currentMonthFilter = 'all';
    let searchQuery = '';
    let sortMode = 'total'; // 'total' | 'avg'
    let expandedSessions = new Set();

    let appState = {
      wifeWeight: 70,
      husbandWeight: 30,
      scoreConfig: { ...DEFAULT_SCORE_CONFIG },
      // ratings[sessionNo][trackIdx] = { h: 'god'|'good'|'normal'|'unknown'|'', w: ... }
      ratings: {}
    };

    function initRatingsStructure() {
      OFFICIAL_26_SESSIONS.forEach(s => {
        if (!appState.ratings[s.sessionNo]) {
          appState.ratings[s.sessionNo] = {};
        }
        s.tracks.forEach((_, idx) => {
          if (!appState.ratings[s.sessionNo][idx]) {
            appState.ratings[s.sessionNo][idx] = { h: '', w: '' };
          }
        });
      });
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      document.getElementById('toastText').innerText = msg;
      box.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 2600);
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error('儲存失敗', e);
      }
    }

    // =========================================================================
    // 【4. 數據壓縮與解壓 (支援 URL Hash 與 WhatsApp 代碼)】
    // =========================================================================
    const LEVEL_TO_CODE = { '': 0, 'god': 4, 'good': 3, 'normal': 2, 'unknown': 1 };
    const CODE_TO_LEVEL = { 0: '', 4: 'god', 3: 'good', 2: 'normal', 1: 'unknown' };

    function packSyncString() {
      const payload = {
        w: appState.wifeWeight,
        c: [appState.scoreConfig.god, appState.scoreConfig.good, appState.scoreConfig.normal, appState.scoreConfig.unknown],
        r: {}
      };
      OFFICIAL_26_SESSIONS.forEach(s => {
        const sMap = appState.ratings[s.sessionNo];
        let hasAny = false;
        const arr = [];
        s.tracks.forEach((_, idx) => {
          const hCode = LEVEL_TO_CODE[sMap[idx]?.h || ''] || 0;
          const wCode = LEVEL_TO_CODE[sMap[idx]?.w || ''] || 0;
          if (hCode > 0 || wCode > 0) hasAny = true;
          arr.push(hCode * 10 + wCode);
        });
        if (hasAny) {
          payload.r[s.sessionNo] = arr;
        }
      });
      return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    }

    function unpackSyncString(codeStr, mergeMode = true) {
      const parsed = JSON.parse(decodeURIComponent(escape(atob(codeStr))));
      initRatingsStructure();

      if (parsed.w !== undefined) {
        appState.wifeWeight = Number(parsed.w);
        appState.husbandWeight = 100 - appState.wifeWeight;
      }
      if (Array.isArray(parsed.c) && parsed.c.length === 4) {
        appState.scoreConfig = {
          god: Number(parsed.c[0]),
          good: Number(parsed.c[1]),
          normal: Number(parsed.c[2]),
          unknown: Number(parsed.c[3])
        };
      }
      if (parsed.r) {
        OFFICIAL_26_SESSIONS.forEach(s => {
          const arr = parsed.r[s.sessionNo];
          if (Array.isArray(arr)) {
            s.tracks.forEach((_, idx) => {
              const val = arr[idx] || 0;
              const hCode = Math.floor(val / 10);
              const wCode = val % 10;
              if (!mergeMode) {
                appState.ratings[s.sessionNo][idx] = {
                  h: CODE_TO_LEVEL[hCode] || '',
                  w: CODE_TO_LEVEL[wCode] || ''
                };
              } else {
                if (hCode > 0) appState.ratings[s.sessionNo][idx].h = CODE_TO_LEVEL[hCode];
                if (wCode > 0) appState.ratings[s.sessionNo][idx].w = CODE_TO_LEVEL[wCode];
              }
            });
          }
        });
      }
    }

    function loadInitialData() {
      initRatingsStructure();

      // 1. 先讀取本地存檔
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.wifeWeight !== undefined) {
            appState.wifeWeight = parsed.wifeWeight;
            appState.husbandWeight = 100 - parsed.wifeWeight;
          }
          if (parsed.scoreConfig) {
            appState.scoreConfig = { ...DEFAULT_SCORE_CONFIG, ...parsed.scoreConfig };
          }
          if (parsed.ratings) {
            appState.ratings = parsed.ratings;
          }
          initRatingsStructure();
        } catch (e) {}
      }

      // 2. 若網址帶有 #data=，合併載入遠端打分
      if (window.location.hash.startsWith('#data=')) {
        try {
          const raw = window.location.hash.replace('#data=', '').trim();
          unpackSyncString(raw, true);
          saveToStorage();
          history.replaceState(null, '', window.location.pathname + window.location.search);
          setTimeout(() => showToast('🎉 已成功從分享連結同步評分數據！'), 300);
        } catch (e) {
          console.error('Hash 解析失敗', e);
        }
      }

      syncControlsUI();
      renderCards();
      recalculateScores();
    }

    // =========================================================================
    // 【5. 權重與分數設定控制】
    // =========================================================================
    function syncControlsUI() {
      document.getElementById('weightSlider').value = appState.wifeWeight;
      document.getElementById('wifeWeightText').innerText = appState.wifeWeight;
      document.getElementById('husbandWeightText').innerText = appState.husbandWeight;

      // 更新預設權重按鈕高亮
      [50, 70, 100, 20].forEach(p => {
        const btn = document.getElementById(`preset-${p}`);
        if (!btn) return;
        if (appState.wifeWeight === p) {
          btn.className = 'px-3 py-1.5 rounded-xl bg-pink-600 text-white font-black shadow-sm transition';
        } else {
          btn.className = 'px-3 py-1.5 rounded-xl text-slate-300 hover:bg-slate-800 transition';
        }
      });

      // 分數設定輸入框
      document.getElementById('cfg-god').value = appState.scoreConfig.god;
      document.getElementById('cfg-good').value = appState.scoreConfig.good;
      document.getElementById('cfg-normal').value = appState.scoreConfig.normal;
      document.getElementById('cfg-unknown').value = appState.scoreConfig.unknown;

      updateRuleBadgeText();
    }

    function updateRuleBadgeText() {
      const c = appState.scoreConfig;
      document.getElementById('currentScoreRuleBadge').innerText =
        `目前計分：🔥神曲=${c.god}分 · 💖好聽=${c.good}分 · ☕普通=${c.normal}分 · ❓唔識=${c.unknown}分`;
    }

    function toggleScoreConfigPanel() {
      const panel = document.getElementById('scoreConfigPanel');
      panel.classList.toggle('hidden');
    }

    function updateScoreConfig() {
      const god = parseFloat(document.getElementById('cfg-god').value);
      const good = parseFloat(document.getElementById('cfg-good').value);
      const normal = parseFloat(document.getElementById('cfg-normal').value);
      const unknown = parseFloat(document.getElementById('cfg-unknown').value);

      appState.scoreConfig = {
        god: isNaN(god) ? DEFAULT_SCORE_CONFIG.god : god,
        good: isNaN(good) ? DEFAULT_SCORE_CONFIG.good : good,
        normal: isNaN(normal) ? DEFAULT_SCORE_CONFIG.normal : normal,
        unknown: isNaN(unknown) ? DEFAULT_SCORE_CONFIG.unknown : unknown
      };
      updateRuleBadgeText();
      saveToStorage();
      renderCards();
      recalculateScores();
    }

    function resetScoreConfig() {
      appState.scoreConfig = { ...DEFAULT_SCORE_CONFIG };
      syncControlsUI();
      saveToStorage();
      renderCards();
      recalculateScores();
      showToast('已還原預設分數 (8 / 6 / 3 / 1)');
    }

    function updateWeight(val) {
      appState.wifeWeight = parseInt(val, 10);
      appState.husbandWeight = 100 - appState.wifeWeight;
      syncControlsUI();
      saveToStorage();
      recalculateScores();
    }

    function setWeightPreset(wifePercent) {
      updateWeight(wifePercent);
    }

    function setSortMode(mode) {
      sortMode = mode;
      const totalBtn = document.getElementById('sort-total-btn');
      const avgBtn = document.getElementById('sort-avg-btn');
      if (mode === 'total') {
        totalBtn.className = 'px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-black transition';
        avgBtn.className = 'px-3 py-1.5 rounded-lg text-slate-300 hover:bg-slate-800 font-bold transition';
      } else {
        avgBtn.className = 'px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-black transition';
        totalBtn.className = 'px-3 py-1.5 rounded-lg text-slate-300 hover:bg-slate-800 font-bold transition';
      }
      recalculateScores();
    }

    // =========================================================================
    // 【6. 單曲打分與整碟快填邏輯】
    // =========================================================================
    function setTrackRating(sessionNo, trackIdx, role, levelKey) {
      const current = appState.ratings[sessionNo][trackIdx][role];
      appState.ratings[sessionNo][trackIdx][role] = (current === levelKey) ? '' : levelKey;
      saveToStorage();
      updateSingleTrackRowUI(sessionNo, trackIdx);
      recalculateScores();
    }

    function quickFillSession(sessionNo, role, mode) {
      const s = OFFICIAL_26_SESSIONS.find(x => x.sessionNo === sessionNo);
      if (!s) return;

      s.tracks.forEach((_, idx) => {
        if (mode === 'clear') {
          appState.ratings[sessionNo][idx][role] = '';
        } else if (mode === 'rest_unknown') {
          if (!appState.ratings[sessionNo][idx][role]) {
            appState.ratings[sessionNo][idx][role] = 'unknown';
          }
        } else {
          appState.ratings[sessionNo][idx][role] = mode;
        }
      });

      // 展開該場次讓用戶看到結果
      expandedSessions.add(sessionNo);
      saveToStorage();
      renderCards();
      recalculateScores();
      const roleName = role === 'h' ? '🤵 老公' : '👰 老婆';
      showToast(`已更新第 ${sessionNo} 場 (${roleName}) 評分`);
    }

    // =========================================================================
    // 【7. 核心分數計算引擎】
    // =========================================================================
    function getLevelPoint(levelKey) {
      if (!levelKey) return 0;
      return appState.scoreConfig[levelKey] ?? 0;
    }

    function calculateSessionMetrics(sessionNo) {
      const s = OFFICIAL_26_SESSIONS.find(x => x.sessionNo === sessionNo);
      const rMap = appState.ratings[sessionNo] || {};
      const trackCount = s.tracks.length;

      let hSum = 0, wSum = 0;
      let hRatedCount = 0, wRatedCount = 0;
      let hGodCount = 0, wGodCount = 0;
      let hGoodCount = 0, wGoodCount = 0;
      let hUnknownCount = 0, wUnknownCount = 0;

      s.tracks.forEach((_, idx) => {
        const tr = rMap[idx] || { h: '', w: '' };
        if (tr.h) {
          hSum += getLevelPoint(tr.h);
          hRatedCount++;
          if (tr.h === 'god') hGodCount++;
          if (tr.h === 'good') hGoodCount++;
          if (tr.h === 'unknown') hUnknownCount++;
        }
        if (tr.w) {
          wSum += getLevelPoint(tr.w);
          wRatedCount++;
          if (tr.w === 'god') wGodCount++;
          if (tr.w === 'good') wGoodCount++;
          if (tr.w === 'unknown') wUnknownCount++;
        }
      });

      const hAvg = hRatedCount > 0 ? (hSum / hRatedCount) : 0;
      const wAvg = wRatedCount > 0 ? (wSum / wRatedCount) : 0;

      const hWeight = appState.husbandWeight / 100;
      const wWeight = appState.wifeWeight / 100;

      // 加權總分與加權單曲平均分
      let weightedTotal = 0;
      let weightedAvg = 0;

      if (hRatedCount > 0 && wRatedCount > 0) {
        weightedTotal = (hSum * hWeight) + (wSum * wWeight);
        weightedAvg = (hAvg * hWeight) + (wAvg * wWeight);
      } else if (hRatedCount > 0) {
        weightedTotal = hSum;
        weightedAvg = hAvg;
      } else if (wRatedCount > 0) {
        weightedTotal = wSum;
        weightedAvg = wAvg;
      }

      const isRated = (hRatedCount > 0 || wRatedCount > 0);

      return {
        trackCount,
        hSum: Math.round(hSum * 10) / 10,
        wSum: Math.round(wSum * 10) / 10,
        hAvg: Math.round(hAvg * 10) / 10,
        wAvg: Math.round(wAvg * 10) / 10,
        hRatedCount,
        wRatedCount,
        hGodCount,
        wGodCount,
        hGoodCount,
        wGoodCount,
        hUnknownCount,
        wUnknownCount,
        weightedTotal: Math.round(weightedTotal * 10) / 10,
        weightedAvg: Math.round(weightedAvg * 100) / 100,
        isRated
      };
    }

    function recalculateScores() {
      const results = OFFICIAL_26_SESSIONS.map(s => ({
        ...s,
        metrics: calculateSessionMetrics(s.sessionNo)
      }));

      const ratedList = results.filter(r => r.metrics.isRated).sort((a, b) => {
        if (sortMode === 'total') {
          if (b.metrics.weightedTotal !== a.metrics.weightedTotal) {
            return b.metrics.weightedTotal - a.metrics.weightedTotal;
          }
          return b.metrics.weightedAvg - a.metrics.weightedAvg;
        } else {
          if (b.metrics.weightedAvg !== a.metrics.weightedAvg) {
            return b.metrics.weightedAvg - a.metrics.weightedAvg;
          }
          return b.metrics.weightedTotal - a.metrics.weightedTotal;
        }
      });

      document.getElementById('totalRatedCount').innerText = `已評 ${ratedList.length} / 26 場`;

      const topBox = document.getElementById('topRecommendations');
      if (ratedList.length === 0) {
        topBox.innerHTML = `
          <div class="col-span-full py-8 text-center text-slate-400 text-sm sm:text-base font-medium bg-slate-950/50 rounded-2xl border border-slate-800/80">
            夫婦二人尚未開始打分！請在下方展開場次為歌曲點選 <span class="text-amber-400 font-bold">[神曲]</span>、<span class="text-emerald-400 font-bold">[好聽]</span>、<span class="text-sky-400 font-bold">[普通]</span> 或 <span class="text-slate-300 font-bold">[唔識]</span>，系統將自動計算 Top 10！
          </div>
        `;
      } else {
        const top10 = ratedList.slice(0, 10);
        topBox.innerHTML = top10.map((item, idx) => {
          const rank = idx + 1;
          const m = item.metrics;
          let rankBadge = '';
          let borderClass = '';

          if (rank === 1) {
            rankBadge = '<span class="text-xs sm:text-sm font-black text-amber-300">🥇 No.1 終極首選</span>';
            borderClass = 'border-2 border-amber-500 bg-amber-950/30 shadow-lg';
          } else if (rank === 2) {
            rankBadge = '<span class="text-xs sm:text-sm font-black text-slate-200">🥈 No.2 次選推薦</span>';
            borderClass = 'border-2 border-slate-300/80 bg-slate-800/60 shadow-md';
          } else if (rank === 3) {
            rankBadge = '<span class="text-xs sm:text-sm font-black text-amber-500">🥉 No.3 備選推薦</span>';
            borderClass = 'border-2 border-amber-700/80 bg-amber-950/20 shadow-md';
          } else {
            rankBadge = `<span class="text-xs font-black px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700">No.${rank}</span>`;
            borderClass = 'border border-slate-800 bg-slate-900/90 hover:border-slate-700';
          }

          const mainScoreText = sortMode === 'total'
            ? `${m.weightedTotal}<span class="text-xs text-slate-400 font-normal ml-0.5">總分</span>`
            : `${m.weightedAvg}<span class="text-xs text-slate-400 font-normal ml-0.5">均分</span>`;

          const subScoreText = sortMode === 'total'
            ? `單曲均分 ${m.weightedAvg}`
            : `加權總分 ${m.weightedTotal}`;

          return `
            <div onclick="jumpToSession(${item.sessionNo})" class="cursor-pointer p-4 rounded-2xl ${borderClass} flex flex-col justify-between transition hover:-translate-y-0.5">
              <div>
                <div class="flex items-center justify-between mb-1">
                  ${rankBadge}
                  <div class="text-right">
                    <div class="text-xl sm:text-2xl font-black text-amber-400 leading-none">${mainScoreText}</div>
                    <div class="text-[11px] text-slate-400 font-semibold mt-0.5">${subScoreText}</div>
                  </div>
                </div>
                <h4 class="font-black text-white text-base sm:text-lg truncate mt-1">${item.name}</h4>
                <div class="text-xs text-slate-300 font-bold mt-0.5">
                  <span class="text-amber-400">第 ${item.sessionNo < 10 ? '0' + item.sessionNo : item.sessionNo} 場</span> · ${item.dateText.replace(/202[67]年/, '')}
                </div>
              </div>
              <div class="mt-3 pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs font-bold">
                <span class="text-blue-400">🤵 總${m.hSum}分 (🔥${m.hGodCount})</span>
                <span class="text-pink-400">👰 總${m.wSum}分 (🔥${m.wGodCount})</span>
              </div>
            </div>
          `;
        }).join('');
      }

      OFFICIAL_26_SESSIONS.forEach(s => updateSessionCardHeaderUI(s.sessionNo));
    }

    function jumpToSession(sessionNo) {
      if (currentMonthFilter !== 'all') {
        filterMonth('all');
      }
      expandedSessions.add(sessionNo);
      renderCards();
      recalculateScores();
      const el = document.getElementById(`card-${sessionNo}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // =========================================================================
    // 【8. 渲染 26 場卡片與曲目選單】
    // =========================================================================
    function filterMonth(month) {
      currentMonthFilter = month;
      ['all', '2026-12', '2027-01', '2027-02', 'rated'].forEach(m => {
        const el = document.getElementById(`tab-${m}`);
        if (!el) return;
        if (m === month) {
          el.className = 'px-4 py-2 rounded-xl bg-amber-500 text-slate-950 font-black shrink-0 shadow-md';
        } else {
          el.className = 'px-4 py-2 rounded-xl bg-slate-900 text-slate-300 hover:bg-slate-800 shrink-0 border border-slate-800 font-bold';
        }
      });
      renderCards();
      recalculateScores();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      const clearBtn = document.getElementById('clearSearchBtn');
      if (searchQuery.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderCards();
      recalculateScores();
    }

    function clearSearch() {
      document.getElementById('songSearchInput').value = '';
      handleSearch('');
    }

    function toggleTracks(sessionNo) {
      if (expandedSessions.has(sessionNo)) {
        expandedSessions.delete(sessionNo);
      } else {
        expandedSessions.add(sessionNo);
      }
      const wrapper = document.getElementById(`tracks-wrapper-${sessionNo}`);
      const icon = document.getElementById(`toggle-icon-${sessionNo}`);
      if (wrapper && icon) {
        wrapper.classList.toggle('hidden');
        icon.classList.toggle('rotate-180');
      }
    }

    function toggleAllTracks(expand) {
      if (expand) {
        OFFICIAL_26_SESSIONS.forEach(s => expandedSessions.add(s.sessionNo));
      } else {
        expandedSessions.clear();
      }
      renderCards();
      recalculateScores();
    }

    function renderTrackButtonsHTML(sessionNo, trackIdx, role) {
      const currentVal = appState.ratings[sessionNo]?.[trackIdx]?.[role] || '';
      return RATING_LEVELS.map(lv => {
        const isActive = currentVal === lv.key;
        const pts = appState.scoreConfig[lv.key];
        let cls = 'bg-slate-800/90 text-slate-300 border-slate-700 hover:bg-slate-700';
        if (isActive) {
          cls = role === 'h' ? lv.activeHus : lv.activeWife;
        }
        return `
          <button type="button"
                  onclick="setTrackRating(${sessionNo}, ${trackIdx}, '${role}', '${lv.key}')"
                  title="${lv.label} (${pts}分)"
                  class="rate-btn px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-xl border text-xs sm:text-sm flex items-center justify-center gap-1 ${cls}">
            <span>${lv.icon}</span>
            <span>${lv.label}</span>
          </button>
        `;
      }).join('');
    }

    function updateSingleTrackRowUI(sessionNo, trackIdx) {
      ['h', 'w'].forEach(role => {
        const container = document.getElementById(`trk-${sessionNo}-${trackIdx}-${role}`);
        if (container) {
          container.innerHTML = renderTrackButtonsHTML(sessionNo, trackIdx, role);
        }
      });

      const m = calculateSessionMetrics(sessionNo);
      const scoreBox = document.getElementById(`badge-score-${sessionNo}`);

          </div>

      } else {
        scoreBox.innerHTML = `
          <div class="flex items-center gap-3 sm:gap-5 bg-slate-950/80 px-4 py-2.5 rounded-2xl border border-slate-800">
            <div class="text-center">
              <div class="text-[11px] font-bold text-blue-400">🤵 老公 (${m.hRatedCount}/${m.trackCount}首)</div>
              <div class="text-sm sm:text-base font-black text-white">${m.hSum}分 <span class="text-xs text-slate-400 font-normal">(均${m.hAvg})</span></div>
            </div>

              <div class="text-[11px] font-bold text-pink-400">👰 老婆 (${m.wRatedCount}/${m.trackCount}首)</div>
              <div class="text-sm sm:text-base font-black text-white">${m.wSum}分 <span class="text-xs text-slate-400 font-normal">(均${m.wAvg})</span></div>
            </div>

              <div class="text-[11px] font-bold text-amber-400">加權總分</div>
              <div class="text-xl sm:text-2xl font-black text-amber-400 leading-none">${m.weightedTotal}<span class="text-xs text-slate-400 font-normal ml-0.5">分</span></div>
              <div class="text-[11px] text-emerald-400 font-bold mt-0.5">均分 ${m.weightedAvg}</div>
            </div>
          </div>
        `;
      }

      if (progressBox) {
        if (!m.isRated) {
          progressBox.innerHTML = `<span class="text-slate-500">點擊展開為 ${m.trackCount} 首歌曲評分</span>`;
        } else {

            <span class="text-emerald-400 font-bold">
              🔥神曲: 老公${m.hGodCount}首 / 老婆${m.wGodCount}首 · 💖好聽: 老公${m.hGoodCount}首 / 老婆${m.wGoodCount}首

          return false;
        }
        if (searchQuery) {
          const matchAlbum = s.name.toLowerCase().includes(searchQuery);
          const matchDate = s.dateText.toLowerCase().includes(searchQuery);
          const matchDesc = s.desc.toLowerCase().includes(searchQuery);
          const matchSong = s.tracks.some(t => t.toLowerCase().includes(searchQuery));
          if (!matchAlbum && !matchDate && !matchDesc && !matchSong) return false;
        }
        return true;
      });

              <!-- 整張專輯快速填分工具列 -->

                  return `

                      <div class="flex items-center gap-2.5 min-w-0">
                        <span class="w-6 h-6 rounded-full bg-slate-800 text-slate-400 text-xs font-bold flex items-center justify-center shrink-0">${tIdx + 1}</span>
                        <span class="text-base sm:text-lg font-bold text-slate-100 break-words ${isMatch ? 'text-amber-300 underline font-black' : ''}">
                          ${trackName}
                        </span>
                      </div>

                      <div class="flex flex-col sm:flex-row sm:items-center gap-2.5 sm:gap-5 shrink-0 pl-8 lg:pl-0">
                        <!-- 老公 4 選 1 -->
                        <div class="flex items-center gap-1.5">
                          <span class="text-xs font-black text-blue-400 w-12 shrink-0">🤵 老公</span>
                          <div class="flex flex-wrap gap-1" id="trk-${s.sessionNo}-${tIdx}-h">
                            ${renderTrackButtonsHTML(s.sessionNo, tIdx, 'h')}
                          </div>
                        </div>

                        <!-- 老婆 4 選 1 -->
                        <div class="flex items-center gap-1.5">
                          <span class="text-xs font-black text-pink-400 w-12 shrink-0">👰 老婆</span>
                          <div class="flex flex-wrap gap-1" id="trk-${s.sessionNo}-${tIdx}-w">
                            ${renderTrackButtonsHTML(s.sessionNo, tIdx, 'w')}
                          </div>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    // =========================================================================
    // 【9. WhatsApp 接力分享與代碼同步視窗 (Modal)】
    // =========================================================================
    function openShareModal() {
      saveToStorage();
      const codeStr = packSyncString();
      const baseUrl = window.location.protocol.startsWith('http')
        ? `${window.location.origin}${window.location.pathname}#data=${codeStr}`
        : '';

      const results = OFFICIAL_26_SESSIONS
        .map(s => ({ ...s, m: calculateSessionMetrics(s.sessionNo) }))
        .filter(x => x.m.isRated)
        .sort((a, b) => b.m.weightedTotal - a.m.weightedTotal);

      const topPreview = results.length > 0
        ? results.slice(0, 3).map((x, i) => `No.${i+1} ${x.name}(${x.m.weightedTotal}分)`).join('、')
        : '尚未完成打分';

      let fullMsg = `🎵【Eason 2026-2027 錄音會 26場選場接力】🎵\n當前心水推薦：${topPreview}\n`;
      if (baseUrl) {
        fullMsg += `\n🔗 點擊連結直接載入打分：\n${baseUrl}\n`;
      }
      fullMsg += `\n📋 接力同步代碼（複製整段貼入「貼上代碼」）：\nEASONSYNC:${codeStr}`;

      document.getElementById('modalTitle').innerHTML = `<i class="fa-brands fa-whatsapp text-emerald-400 text-2xl"></i> 產生 WhatsApp 接力分享`;
      document.getElementById('modalDesc').innerText = baseUrl
        ? '已為你產生專屬同步連結與接力碼！複製後傳給另一半，對方點開連結或貼上代碼即可同步所有歌曲評分：'
        : '目前已產生接力同步代碼！複製下方文字透過 WhatsApp 傳給另一半，對方點選頂部「貼上代碼」即可同步所有歌曲評分：';
      
      const textarea = document.getElementById('modalTextarea');
      textarea.value = fullMsg;
      textarea.readOnly = true;

      const waUrl = `https://wa.me/?text=${encodeURIComponent(fullMsg)}`;
      document.getElementById('modalActions').innerHTML = `
        <button type="button" onclick="copyModalText()" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs sm:text-sm flex items-center gap-1.5">
          <i class="fa-regular fa-copy"></i> 一鍵複製文字與代碼
        </button>
        <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs sm:text-sm flex items-center gap-1.5">
          <i class="fa-brands fa-whatsapp"></i> 直接開啟 WhatsApp 傳送
        </a>
      `;

      document.getElementById('syncModal').classList.remove('hidden');
    }

    function copyModalText() {
      const textarea = document.getElementById('modalTextarea');
      textarea.select();
      navigator.clipboard.writeText(textarea.value).then(() => {
        showToast('✅ 已複製到剪貼簿！可貼上至 WhatsApp');
      }).catch(() => {
        document.execCommand('copy');
        showToast('✅ 已複製到剪貼簿！');
      });
    }

    function openImportModal() {
      document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-file-import text-sky-400 text-xl"></i> 貼上另一半的接力代碼`;
      document.getElementById('modalDesc').innerText = '請將另一半從 WhatsApp 傳給你的整段訊息或 EASONSYNC 代碼貼在下方空格，然後按「確認同步」：';
      
      const textarea = document.getElementById('modalTextarea');
      textarea.value = '';
      textarea.readOnly = false;
      textarea.placeholder = '在此貼上包含 EASONSYNC:... 或 #data=... 的訊息';

      document.getElementById('modalActions').innerHTML = `
        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs sm:text-sm">
          取消
        </button>
        <button type="button" onclick="confirmImportCode()" class="px-5 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-xs sm:text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-check"></i> 確認同步評分
        </button>
      `;

      document.getElementById('syncModal').classList.remove('hidden');
    }

    function confirmImportCode() {
      const rawInput = document.getElementById('modalTextarea').value.trim();
      if (!rawInput) {
        alert('請先貼上代碼！');
        return;
      }
      try {
        let code = rawInput;
        if (code.includes('EASONSYNC:')) {
          code = code.split('EASONSYNC:')[1].split(/\s+/)[0].trim();
        } else if (code.includes('#data=')) {
          code = code.split('#data=')[1].split(/\s+/)[0].trim();
        }
        unpackSyncString(code, true);
        saveToStorage();
        syncControlsUI();
        renderCards();
        recalculateScores();
        closeModal();
        showToast('🎉 成功同步另一半的評分數據！');
      } catch (e) {
        alert('❌ 代碼格式不正確，請確認複製了完整的 EASONSYNC 訊息！');
      }
    }

    function closeModal() {
      document.getElementById('syncModal').classList.add('hidden');
    }

    // =========================================================================
    // 【10. 測試數據、JSON 備份與清空重置】
    // =========================================================================
    function loadDemoData() {
      initRatingsStructure();
      const hotSessions = [26, 19, 13, 11, 6, 25, 5, 8, 24, 21, 9, 10];
      hotSessions.forEach((sNo, idx) => {
        const s = OFFICIAL_26_SESSIONS.find(x => x.sessionNo === sNo);
        if (!s) return;
        s.tracks.forEach((_, tIdx) => {
          const hPool = idx < 4 ? ['god', 'god', 'good', 'good', 'normal'] : ['god', 'good', 'normal', 'normal', 'unknown'];
          const wPool = idx < 5 ? ['god', 'good', 'good', 'normal', 'god'] : ['good', 'normal', 'normal', 'unknown', 'unknown'];
          appState.ratings[sNo][tIdx] = {
            h: hPool[(tIdx + sNo) % hPool.length],
            w: wPool[(tIdx * 2 + sNo) % wPool.length]
          };
        });
      });
      saveToStorage();
      renderCards();
      recalculateScores();
      showToast('✨ 已載入 12 場熱門測試評分！可查看 Top 10 效果');
    }

    function exportJSONFile() {
      saveToStorage();
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(appState, null, 2));
      const a = document.createElement('a');
      a.setAttribute('href', dataStr);
      a.setAttribute('download', `eason_2026_ratings_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('已下載 JSON 備份檔案');
    }

    function resetAllData() {
      if (confirm('確定要清空所有已打的分數並還原初始狀態嗎？')) {
        localStorage.removeItem(STORAGE_KEY);
        appState = {
          wifeWeight: 70,
          husbandWeight: 30,
          scoreConfig: { ...DEFAULT_SCORE_CONFIG },
          ratings: {}
        };
        expandedSessions.clear();
        initRatingsStructure();
        syncControlsUI();
        renderCards();
        recalculateScores();
        showToast('已清空所有評分記錄');
      }
    }

    window.addEventListener('DOMContentLoaded', loadInitialData);
  </script>
</body>
</html>

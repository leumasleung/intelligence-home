<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eason 2026-2027 錄音會選場器 (官方 26 場 · 303 首完整曲目核對版)</title>
  <style>
    :root {
      --bg-body: #020617;
      --bg-card: #0f172a;
      --bg-sub: #1e293b;
      --bg-input: #090d16;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --amber: #f59e0b;
      --amber-light: #fcd34d;
      --blue: #3b82f6;
      --pink: #ec4899;
      --emerald: #10b981;
      --rose: #f43f5e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
    }
    .hidden { display: none !important; }
    .container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 16px;
    }
    /* 頂部導航 */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .header-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #f59e0b, #f43f5e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 900;
      margin: 0;
      color: #ffffff;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 2px 0 0 0;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 15px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 800;
      border: 1px solid var(--border);
      background-color: var(--bg-sub);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      user-select: none;
    }
    .btn:hover { filter: brightness(1.12); border-color: #64748b; }
    .btn:active { transform: scale(0.96); }
    .btn-amber { background-color: var(--amber); color: #020617; border-color: var(--amber-light); }
    .btn-emerald { background-color: #059669; color: #ffffff; border-color: #34d399; }
    .btn-indigo { background-color: #4f46e5; color: #ffffff; border-color: #818cf8; }
    .btn-rose { background-color: #881337; color: #ffe4e6; border-color: #f43f5e; }
    .btn-pink-active { background-color: #db2777; color: #ffffff; border-color: #f472b6; }

    /* 區塊面板 */
    .panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .panel-highlight {
      background: linear-gradient(145deg, rgba(30, 27, 75, 0.75), rgba(15, 23, 42, 0.96));
      border: 2px solid rgba(99, 102, 241, 0.45);
    }
    .panel-amber {
      border: 2px solid rgba(245, 158, 11, 0.55);
    }
    .panel-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .panel-title {
      font-size: 1.2rem;
      font-weight: 900;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 4欄分數設定 */
    .cfg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .cfg-box {
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }
    .cfg-box label {
      display: block;
      font-size: 0.9rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .cfg-input {
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 900;
    }

    /* 夫妻權重滑桿 */
    .weight-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .weight-num {
      font-size: 1.5rem;
      font-weight: 900;
    }
    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 14px;
      background: linear-gradient(90deg, #3b82f6 0%, #ec4899 100%);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #ec4899;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }
    .rule-hint {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Top 10 推薦網格 */
    .top10-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px;
    }
    .top-card {
      background-color: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top-card:hover {
      transform: translateY(-2px);
      border-color: var(--amber);
    }
    .top-card.rank-1 {
      border: 2px solid #f59e0b;
      background: linear-gradient(145deg, rgba(120, 53, 15, 0.35), rgba(15, 23, 42, 0.95));
    }
    .top-card.rank-2 {
      border: 2px solid #cbd5e1;
      background: linear-gradient(145deg, rgba(51, 65, 85, 0.45), rgba(15, 23, 42, 0.95));
    }
    .top-card.rank-3 {
      border: 2px solid #d97706;
      background: linear-gradient(145deg, rgba(92, 45, 18, 0.3), rgba(15, 23, 42, 0.95));
    }
    .empty-top10 {
      grid-column: 1 / -1;
      text-align: center;
      padding: 28px 16px;
      background-color: rgba(2, 6, 23, 0.55);
      border: 1px dashed var(--border);
      border-radius: 16px;
    }

    /* 搜尋框與月份分頁 */
    .search-wrap {
      position: relative;
      margin-top: 20px;
    }
    .search-input {
      width: 100%;
      background-color: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 14px 44px 14px 18px;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
      outline: none;
    }
    .search-input:focus { border-color: var(--amber); }
    .clear-search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--bg-sub);
      color: #ffffff;
      font-weight: 900;
      cursor: pointer;
    }
    .tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0 4px 0;
    }
    .tab-btn {
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      background-color: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      background-color: var(--amber);
      color: #020617;
      border-color: var(--amber-light);
      font-weight: 900;
    }

    /* 場次卡片與歌曲清單 */
    .session-card {
      background-color: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 22px;
      margin-top: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }
    .session-top {
      padding: 18px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .session-info {
      cursor: pointer;
      flex: 1 1 320px;
    }
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .session-badge {
      background-color: rgba(245, 158, 11, 0.18);
      color: var(--amber-light);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 900;
    }
    .session-date {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e2e8f0;
    }
    .session-count {
      background-color: var(--bg-sub);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .session-title {
      font-size: 1.4rem;
      font-weight: 900;
      margin: 4px 0;
      color: #ffffff;
    }
    .session-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0;
    }
    .score-summary-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 16px;
    }
    .session-bar {
      padding: 10px 20px;
      background-color: rgba(2, 6, 23, 0.65);
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .expand-btn {
      background: none;
      border: none;
      color: var(--amber-light);
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
      padding: 4px 0;
    }
    .tracks-area {
      border-top: 1px solid var(--border);
      background-color: rgba(2, 6, 23, 0.85);
      padding: 16px 20px;
    }
    .quick-fill-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .quick-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .mini-btn {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 800;
      border: 1px solid var(--border);
      background-color: var(--bg-sub);
      color: #e2e8f0;
      cursor: pointer;
    }
    .mini-btn:hover { background-color: #334155; }

    /* 單曲列與 4 選 1 評分按鈕 */
    .track-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 8px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.55);
    }
    .track-row:last-child { border-bottom: none; }
    .track-row.match-highlight {
      background-color: rgba(245, 158, 11, 0.14);
      border-radius: 12px;
      padding-left: 12px;
      padding-right: 12px;
    }
    .track-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 240px;
      min-width: 0;
    }
    .track-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: var(--bg-sub);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .track-name {
      font-size: 1.08rem;
      font-weight: 800;
      color: #ffffff;
      word-break: break-word;
    }
    .track-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }
    .role-rater {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .role-tag {
      font-size: 0.85rem;
      font-weight: 900;
      width: 52px;
      flex-shrink: 0;
    }
    .rate-btn {
      padding: 7px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--bg-sub);
      color: #cbd5e1;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.1s ease;
    }
    .rate-btn:hover { border-color: #64748b; }
    .rate-btn:active { transform: scale(0.93); }
    .rate-active-god {
      background-color: #f59e0b !important;
      color: #020617 !important;
      border-color: #fde68a !important;
      font-weight: 900 !important;
      box-shadow: 0 3px 10px rgba(245, 158, 11, 0.4);
    }
    .rate-active-good-h {
      background-color: #2563eb !important;
      color: #ffffff !important;
      border-color: #93c5fd !important;
      font-weight: 900 !important;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.4);
    }
    .rate-active-good-w {
      background-color: #db2777 !important;
      color: #ffffff !important;
      border-color: #f9a8d4 !important;
      font-weight: 900 !important;
      box-shadow: 0 3px 10px rgba(219, 39, 119, 0.4);
    }
    .rate-active-normal-h {
      background-color: #075985 !important;
      color: #e0f2fe !important;
      border-color: #38bdf8 !important;
    }
    .rate-active-normal-w {
      background-color: #881337 !important;
      color: #ffe4e6 !important;
      border-color: #fb7185 !important;
    }
    .rate-active-unknown {
      background-color: #475569 !important;
      color: #ffffff !important;
      border-color: #94a3b8 !important;
    }

    /* 彈出視窗與 Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background-color: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 22px;
      max-width: 540px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }
    .modal-textarea {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      color: var(--amber-light);
      font-family: monospace;
      font-size: 0.88rem;
      margin: 12px 0;
    }
    .toast-box {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      background-color: #059669;
      color: #ffffff;
      border: 1px solid #34d399;
      padding: 12px 22px;
      border-radius: 14px;
      font-weight: 900;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <!-- 頂部導航列 -->
  <header class="app-header">
    <div class="container header-inner">
      <div class="brand-box">
        <div class="brand-icon">💿</div>
        <div>
          <h1 class="brand-title">Eason 2026-2027 錄音會選場器</h1>
          <p class="brand-sub">官方 26 場 · 303 首完整曲目核對版</p>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn" onclick="toggleScoreConfigPanel()" style="color:#fcd34d;">⚙️ 分數設定</button>
        <button type="button" class="btn" onclick="openImportModal()" style="color:#7dd3fc;">📥 貼上接力碼</button>
        <button type="button" class="btn btn-emerald" onclick="openShareModal()">📲 WhatsApp 接力分享</button>
      </div>
    </div>
  </header>

  <!-- 主體內容 -->
  <main class="container" style="padding-bottom: 80px;">

    <!-- 可折疊：分數權重自訂面板 -->
    <section id="scoreConfigPanel" class="panel panel-amber hidden">
      <div class="panel-header">
        <h2 class="panel-title" style="color:#fbbf24;">⚙️ 自訂各等級分數權重（預設：8 / 6 / 3 / 1）</h2>
        <div class="btn-row">
          <button type="button" class="btn" onclick="resetScoreConfig()">🔄 還原預設 (8/6/3/1)</button>
          <button type="button" class="btn btn-amber" onclick="toggleScoreConfigPanel()">✕ 收起</button>
        </div>
      </div>
      <div class="cfg-grid">
        <div class="cfg-box">
          <label style="color:#fbbf24;">🔥 [神曲] 分數</label>
          <input type="number" id="cfg-god" class="cfg-input" step="0.5" value="8" oninput="updateScoreConfig()">
        </div>
        <div class="cfg-box">
          <label style="color:#34d399;">💖 [好聽] 分數</label>
          <input type="number" id="cfg-good" class="cfg-input" step="0.5" value="6" oninput="updateScoreConfig()">
        </div>
        <div class="cfg-box">
          <label style="color:#38bdf8;">☕ [普通] 分數</label>
          <input type="number" id="cfg-normal" class="cfg-input" step="0.5" value="3" oninput="updateScoreConfig()">
        </div>
        <div class="cfg-box">
          <label style="color:#cbd5e1;">❓ [唔識] 分數</label>
          <input type="number" id="cfg-unknown" class="cfg-input" step="0.5" value="1" oninput="updateScoreConfig()">
        </div>
      </div>
    </section>

    <!-- 夫妻話事權重調配 -->
    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">⚖️ 夫妻話事權重調配</h2>
        <div class="btn-row">
          <button type="button" id="preset-50" class="btn" onclick="setWeightPreset(50)">平權 50:50</button>
          <button type="button" id="preset-70" class="btn btn-pink-active" onclick="setWeightPreset(70)">求生欲 70:30</button>
          <button type="button" id="preset-100" class="btn" onclick="setWeightPreset(100)">老婆全權 100%</button>
          <button type="button" id="preset-20" class="btn" onclick="setWeightPreset(20)">老公話事 80%</button>
        </div>
      </div>
      <div>
        <div class="weight-labels">
          <span style="color:#60a5fa;">🤵 老公佔比: <span id="husbandWeightText" class="weight-num">30</span>%</span>
          <span style="color:#f472b6;">👰 老婆佔比: <span id="wifeWeightText" class="weight-num">70</span>%</span>
        </div>
        <input id="weightSlider" type="range" min="0" max="100" value="70" class="slider" oninput="updateWeight(this.value)">
        <div class="rule-hint">
          <span id="currentScoreRuleBadge" style="color:#fde68a; font-weight:700;">目前計分：🔥神曲=8分 · 💖好聽=6分 · ☕普通=3分 · ❓唔識=1分</span>
          <span>點擊歌曲旁按鈕即可打分，再點一次可取消</span>
        </div>
      </div>
    </section>

    <!-- Top 10 首選推薦榜 -->
    <section class="panel panel-highlight">
      <div class="panel-header">
        <div class="btn-row">
          <h2 class="panel-title" style="color:#e0e7ff;">🏆 當前最佳場次推薦 Top 10</h2>
          <span id="totalRatedCount" class="session-badge">已評 0 / 26 場</span>
        </div>
        <div class="btn-row">
          <button type="button" id="sort-total-btn" class="btn btn-amber" onclick="setSortMode('total')">按加權總分 (神曲多優先)</button>
          <button type="button" id="sort-avg-btn" class="btn" onclick="setSortMode('avg')">按單曲均分 (全碟精準度)</button>
          <button type="button" class="btn btn-indigo" onclick="loadDemoData()">✨ 載入示範評分</button>
        </div>
      </div>
      <div id="topRecommendations" class="top10-grid"></div>
    </section>

    <!-- 搜尋與月份篩選 -->
    <div class="search-wrap">
      <input type="text" id="songSearchInput" class="search-input" oninput="handleSearch(this.value)"

          const hCode = LEVEL_TO_CODE[cell.h] || 0;
          const wCode = LEVEL_TO_CODE[cell.w] || 0;
          if (hCode > 0 || wCode > 0) hasAny = true;
          arr.push(hCode * 10 + wCode);
        });
        if (hasAny) payload.r[s.sessionNo] = arr;
      });
      return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    }

    function unpackSyncString(codeStr, mergeMode) {
      const parsed = JSON.parse(decodeURIComponent(escape(atob(codeStr))));
      initRatingsStructure();
      if (parsed.w !== undefined) {
        appState.wifeWeight = Number(parsed.w);
        appState.husbandWeight = 100 - appState.wifeWeight;
      }
      if (Array.isArray(parsed.c) && parsed.c.length === 4) {
        appState.scoreConfig = {
          god: Number(parsed.c[0]),
          good: Number(parsed.c[1]),
          normal: Number(parsed.c[2]),
          unknown: Number(parsed.c[3])
        };
      }
      if (parsed.r) {
        OFFICIAL_26_SESSIONS.forEach(function(s) {
          const arr = parsed.r[s.sessionNo];
          if (Array.isArray(arr)) {
            s.tracks.forEach(function(_, idx) {
              const val = arr[idx] || 0;
              const hCode = Math.floor(val / 10);
              const wCode = val % 10;
              if (!mergeMode) {
                appState.ratings[s.sessionNo][idx] = {
                  h: CODE_TO_LEVEL[hCode] || "",
                  w: CODE_TO_LEVEL[wCode] || ""
                };
              } else {
                if (hCode > 0) appState.ratings[s.sessionNo][idx].h = CODE_TO_LEVEL[hCode];
                if (wCode > 0) appState.ratings[s.sessionNo][idx].w = CODE_TO_LEVEL[wCode];
              }
            });
          }
        });
      }
    }

    // =========================================================================
    function setTrackRating(sessionNo, trackIdx, role, levelKey) {
      const current = appState.ratings[sessionNo][trackIdx][role];
      appState.ratings[sessionNo][trackIdx][role] = (current === levelKey) ? "" : levelKey;
      saveToStorage();
      updateSingleTrackRowUI(sessionNo, trackIdx);

    function quickFillSession(sessionNo, role, mode) {
      const s = OFFICIAL_26_SESSIONS.find(function(x) { return x.sessionNo === sessionNo; });
      if (!s) return;
      s.tracks.forEach(function(_, idx) {
        if (mode === "clear") {
          appState.ratings[sessionNo][idx][role] = "";
        } else if (mode === "rest_unknown") {
          if (!appState.ratings[sessionNo][idx][role]) {
            appState.ratings[sessionNo][idx][role] = "unknown";
          }
        } else {
          appState.ratings[sessionNo][idx][role] = mode;
        }
      });
      expandedSessions.add(sessionNo);
      saveToStorage();
      renderCards();
      recalculateScores();
      showToast("已更新第 " + sessionNo + " 場 (" + (role === "h" ? "🤵老公" : "👰老婆") + ") 評分");
    }

    // =========================================================================
    // 7. 分數計算與 Top 10 渲染
    // =========================================================================
    function getLevelPoint(levelKey) {
      if (!levelKey) return 0;
      return appState.scoreConfig[levelKey] !== undefined ? appState.scoreConfig[levelKey] : 0;
    }

    function calculateSessionMetrics(sessionNo) {
      const s = OFFICIAL_26_SESSIONS.find(function(x) { return x.sessionNo === sessionNo; });
      const rMap = appState.ratings[sessionNo] || {};
      const trackCount = s.tracks.length;

      let hSum = 0, wSum = 0;
      let hRatedCount = 0, wRatedCount = 0;
      let hGodCount = 0, wGodCount = 0;
      let hGoodCount = 0, wGoodCount = 0;

      s.tracks.forEach(function(_, idx) {
        const tr = rMap[idx] || { h: "", w: "" };
        if (tr.h) {
          hSum += getLevelPoint(tr.h);
          hRatedCount++;
          if (tr.h === "god") hGodCount++;
          if (tr.h === "good") hGoodCount++;
        }
        if (tr.w) {
          wSum += getLevelPoint(tr.w);
          wRatedCount++;
          if (tr.w === "god") wGodCount++;
          if (tr.w === "good") wGoodCount++;
        }
      });

      const hAvg = hRatedCount > 0 ? (hSum / hRatedCount) : 0;
      const wAvg = wRatedCount > 0 ? (wSum / wRatedCount) : 0;
      const hWeight = appState.husbandWeight / 100;
      const wWeight = appState.wifeWeight / 100;

      let weightedTotal = 0;
      let weightedAvg = 0;
      if (hRatedCount > 0 && wRatedCount > 0) {
        weightedTotal = (hSum * hWeight) + (wSum * wWeight);
        weightedAvg = (hAvg * hWeight) + (wAvg * wWeight);
      } else if (hRatedCount > 0) {
        weightedTotal = hSum;
        weightedAvg = hAvg;
      } else if (wRatedCount > 0) {
        weightedTotal = wSum;
        weightedAvg = wAvg;
      }

      return {
        trackCount: trackCount,
        hSum: Math.round(hSum * 10) / 10,
        wSum: Math.round(wSum * 10) / 10,
        hAvg: Math.round(hAvg * 10) / 10,
        wAvg: Math.round(wAvg * 10) / 10,
        hRatedCount: hRatedCount,
        wRatedCount: wRatedCount,
        hGodCount: hGodCount,
        wGodCount: wGodCount,
        hGoodCount: hGoodCount,
        wGoodCount: wGoodCount,
        weightedTotal: Math.round(weightedTotal * 10) / 10,
        weightedAvg: Math.round(weightedAvg * 100) / 100,
        isRated: (hRatedCount > 0 || wRatedCount > 0)
      };
    }

    function recalculateScores() {
      const results = OFFICIAL_26_SESSIONS.map(function(s) {
        return { session: s, metrics: calculateSessionMetrics(s.sessionNo) };
      });

      const ratedList = results.filter(function(r) { return r.metrics.isRated; }).sort(function(a, b) {
        if (sortMode === "total") {
          if (b.metrics.weightedTotal !== a.metrics.weightedTotal) return b.metrics.weightedTotal - a.metrics.weightedTotal;
          return b.metrics.weightedAvg - a.metrics.weightedAvg;
        } else {
          if (b.metrics.weightedAvg !== a.metrics.weightedAvg) return b.metrics.weightedAvg - a.metrics.weightedAvg;
          return b.metrics.weightedTotal - a.metrics.weightedTotal;
        }
      });

      document.getElementById("totalRatedCount").innerText = "已評 " + ratedList.length + " / 26 場";

      const topBox = document.getElementById("topRecommendations");
      if (ratedList.length === 0) {
        topBox.innerHTML =
          '<div class="empty-top10">' +
            '<p style="font-size:1.05rem; margin:0 0 14px 0; color:#cbd5e1;">👇 請在下方歌單點選 <b style="color:#fbbf24;">[🔥神曲]</b>、<b style="color:#34d399;">[💖好聽]</b>、<b style="color:#38bdf8;">[☕普通]</b> 或 <b style="color:#94a3b8;">[❓唔識]</b>，系統將自動排出 Top 10！</p>' +
            '<button type="button" class="btn btn-amber" onclick="loadDemoData()">✨ 點此一鍵載入示範評分 (預覽 Top 10 排行榜)</button>' +
          '</div>';
      } else {
        const top10 = ratedList.slice(0, 10);
        topBox.innerHTML = top10.map(function(item, idx) {
          const rank = idx + 1;
          const s = item.session;
          const m = item.metrics;
          const rankClass = rank <= 3 ? ("rank-" + rank) : "";
          const badgeLabel = rank === 1 ? "🥇 No.1 終極首選" : (rank === 2 ? "🥈 No.2 次選推薦" : (rank === 3 ? "🥉 No.3 備選推薦" : ("No." + rank)));
          const mainScore = sortMode === "total" ? (m.weightedTotal + " 總分") : (m.weightedAvg + " 均分");
          const subScore = sortMode === "total" ? ("單曲均分 " + m.weightedAvg) : ("加權總分 " + m.weightedTotal);
          const sNumStr = s.sessionNo < 10 ? ("0" + s.sessionNo) : s.sessionNo;

          return (
            '<div class="top-card ' + rankClass + '" onclick="jumpToSession(' + s.sessionNo + ')">' +
              '<div>' +
                '<div style="display:flex; justify-content:space-between; align-items:flex-start;">' +
                  '<span class="session-badge">' + badgeLabel + '</span>' +
                  '<div style="text-align:right;">' +
                    '<div style="font-size:1.35rem; font-weight:900; color:#fbbf24; line-height:1.1;">' + mainScore + '</div>' +
                    '<div style="font-size:0.78rem; color:#94a3b8;">' + subScore + '</div>' +
                  '</div>' +
                '</div>' +
                '<div style="font-size:1.15rem; font-weight:900; color:#ffffff; margin-top:8px;">' + s.name + '</div>' +
                '<div style="font-size:0.85rem; color:#cbd5e1; margin-top:3px;">第 ' + sNumStr + ' 場 · ' + s.dateText + '</div>' +
              '</div>' +
              '<div style="margin-top:12px; padding-top:8px; border-top:1px solid #334155; display:flex; justify-content:space-between; font-size:0.85rem; font-weight:800;">' +
                '<span style="color:#60a5fa;">🤵 ' + m.hSum + '分 (🔥' + m.hGodCount + ')</span>' +
                '<span style="color:#f472b6;">👰 ' + m.wSum + '分 (🔥' + m.wGodCount + ')</span>' +
              '</div>' +
            '</div>'
          );
        }).join("");
      }

      OFFICIAL_26_SESSIONS.forEach(function(s) {
        updateSessionCardHeaderUI(s.sessionNo);
      });
    }

    function jumpToSession(sessionNo) {
      if (currentMonthFilter !== "all") {
        filterMonth("all");
      }
      expandedSessions.add(sessionNo);
      renderCards();
      recalculateScores();
      const el = document.getElementById("card-" + sessionNo);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // =========================================================================
    // 8. 渲染 26 場卡片與曲目選單
    // =========================================================================
    function filterMonth(month) {
      currentMonthFilter = month;
      ["all", "2026-12", "2027-01", "2027-02", "rated"].forEach(function(m) {
        const el = document.getElementById("tab-" + m);
        if (el) el.className = (m === month) ? "tab-btn active" : "tab-btn";
      });
      renderCards();
      recalculateScores();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      const clearBtn = document.getElementById("clearSearchBtn");
      if (clearBtn) {
        if (searchQuery.length > 0) clearBtn.classList.remove("hidden");
        else clearBtn.classList.add("hidden");
      }
      renderCards();
      recalculateScores();
    }

    function clearSearch() {
      document.getElementById("songSearchInput").value = "";
      handleSearch("");
    }

    function toggleTracks(sessionNo) {
      if (expandedSessions.has(sessionNo)) expandedSessions.delete(sessionNo);
      else expandedSessions.add(sessionNo);

      const wrapper = document.getElementById("tracks-wrapper-" + sessionNo);
      const btnText = document.getElementById("toggle-text-" + sessionNo);
      const s = OFFICIAL_26_SESSIONS.find(function(x) { return x.sessionNo === sessionNo; });
      if (wrapper && s) {
        const isHidden = wrapper.classList.toggle("hidden");
        if (btnText) {
          btnText.innerText = isHidden
            ? ("▼ 點擊展開完整 " + s.tracks.length + " 首歌曲評分選單")

        OFFICIAL_26_SESSIONS.forEach(function(s) { expandedSessions.add(s.sessionNo); });

        expandedSessions.clear();
      }
      renderCards();
      recalculateScores();

      const currentVal = (appState.ratings[sessionNo] && appState.ratings[sessionNo][trackIdx])
        ? appState.ratings[sessionNo][trackIdx][role]
        : "";
      return RATING_LEVELS.map(function(lv) {
        const isActive = currentVal === lv.key;
        const pts = appState.scoreConfig[lv.key];
        const activeCls = isActive ? (role === "h" ? lv.activeHus : lv.activeWife) : "";
        return (
          '<button type="button" class="rate-btn ' + activeCls + '" ' +

            '</div>' +

              '<div style="font-size:0.78rem; color:#fbbf24; font-weight:800;">加權總分</div>' +

            '</span>';

    function renderCards() {
      const container = document.getElementById("albumListContainer");
      const filtered = OFFICIAL_26_SESSIONS.filter(function(s) {
        if (currentMonthFilter === "rated") {
          if (!calculateSessionMetrics(s.sessionNo).isRated) return false;
        } else if (currentMonthFilter !== "all" && s.monthGroup !== currentMonthFilter) {
          return false;
        }
        if (searchQuery) {
          const matchAlbum = s.name.toLowerCase().indexOf(searchQuery) !== -1;
          const matchDate = s.dateText.toLowerCase().indexOf(searchQuery) !== -1;
          const matchDesc = s.desc.toLowerCase().indexOf(searchQuery) !== -1;
          const matchSong = s.tracks.some(function(t) { return t.toLowerCase().indexOf(searchQuery) !== -1; });
          if (!matchAlbum && !matchDate && !matchDesc && !matchSong) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML =
          '<div class="panel" style="text-align:center; padding:36px; color:#cbd5e1; font-weight:800;">' +
            '找不到符合條件的場次或歌曲，請嘗試其他關鍵字或切換月份分頁。' +

                  '<button type="button" class="mini-btn" onclick="quickFillSession(' + s.sessionNo + ', \'w\', \'rest_unknown\')">未評設為[唔識]</button>' +
                  '<button type="button" class="mini-btn" onclick="quickFillSession(' + s.sessionNo + ', \'w\', \'good\')">全碟[好聽]</button>' +
                  '<button type="button" class="mini-btn" onclick="quickFillSession(' + s.sessionNo + ', \'w\', \'normal\')">全碟[普通]</button>' +
                  '<button type="button" class="mini-btn" onclick="quickFillSession(' + s.sessionNo + ', \'w\', \'clear\')" style="color:#fda4af;">清空本場</button>' +
                '</div>' +
              '</div>' +
              '<div>' + tracksHTML + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join("");
    }

    // =========================================================================
    // 9. WhatsApp 接力分享與代碼匯入視窗
    // =========================================================================
    function openShareModal() {
      saveToStorage();
      const codeStr = packSyncString();
      const baseUrl = window.location.protocol.indexOf("http") === 0
        ? (window.location.origin + window.location.pathname + "#data=" + codeStr)
        : "";

      const rated = OFFICIAL_26_SESSIONS
        .map(function(s) { return { s: s, m: calculateSessionMetrics(s.sessionNo) }; })
        .filter(function(x) { return x.m.isRated; })
        .sort(function(a, b) { return b.m.weightedTotal - a.m.weightedTotal; });

      const topPreview = rated.length > 0
        ? rated.slice(0, 3).map(function(x, i) { return "No." + (i + 1) + " " + x.s.name + "(" + x.m.weightedTotal + "分)"; }).join("、")
        : "尚未完成打分";

      let fullMsg = "🎵【Eason 2026-2027 錄音會 26場選場接力】🎵\n當前心水推薦：" + topPreview + "\n";
      if (baseUrl) fullMsg += "\n🔗 點擊連結直接載入打分：\n" + baseUrl + "\n";
      fullMsg += "\n📋 接力同步代碼（複製整段貼入「貼上接力碼」）：\nEASONSYNC:" + codeStr;

      document.getElementById("modalTitle").innerText = "📲 WhatsApp 接力分享";
      document.getElementById("modalDesc").innerText = "複製下方文字與代碼傳給另一半，對方點開連結或按「📥 貼上接力碼」即可同步所有歌曲評分：";
      const ta = document.getElementById("modalTextarea");
      ta.classList.remove("hidden");
      ta.value = fullMsg;
      ta.readOnly = true;

      const waUrl = "https://wa.me/?text=" + encodeURIComponent(fullMsg);
      document.getElementById("modalActions").innerHTML =
        '<button type="button" class="btn btn-amber" onclick="copyModalText()">📋 一鍵複製文字與代碼</button>' +
        '<a href="' + waUrl + '" target="_blank" rel="noopener noreferrer" class="btn btn-emerald">📲 開啟 WhatsApp 傳送</a>';

      document.getElementById("syncModal").classList.remove("hidden");
    }

    function copyModalText() {
      const ta = document.getElementById("modalTextarea");
      ta.select();
      try {
        document.execCommand("copy");
        showToast("已複製到剪貼簿！可貼上至 WhatsApp");
      } catch (e) {
        showToast("請手動全選文字框複製");
      }
    }

    function openImportModal() {
      document.getElementById("modalTitle").innerText = "📥 貼上另一半的接力代碼";
      document.getElementById("modalDesc").innerText = "請將另一半從 WhatsApp 傳給你的整段訊息或 EASONSYNC 代碼貼在下方，然後按「確認同步」：";
      const ta = document.getElementById("modalTextarea");
      ta.classList.remove("hidden");
      ta.value = "";
      ta.readOnly = false;
      ta.placeholder = "在此貼上包含 EASONSYNC:... 或 #data=... 的訊息";

      document.getElementById("modalActions").innerHTML =
        '<button type="button" class="btn" onclick="closeModal()">取消</button>' +
        '<button type="button" class="btn btn-amber" onclick="confirmImportCode()">✅ 確認同步評分</button>';

      document.getElementById("syncModal").classList.remove("hidden");
    }

    function confirmImportCode() {
      const rawInput = document.getElementById("modalTextarea").value.trim();
      if (!rawInput) {
        showToast("請先在輸入框貼上代碼！");
        return;
      }
      try {
        let code = rawInput;
        if (code.indexOf("EASONSYNC:") !== -1) {
          code = code.split("EASONSYNC:")[1].split(/\s+/)[0].trim();
        } else if (code.indexOf("#data=") !== -1) {
          code = code.split("#data=")[1].split(/\s+/)[0].trim();
        }
        unpackSyncString(code, true);
        saveToStorage();
        syncControlsUI();
        renderCards();
        recalculateScores();
        closeModal();
        showToast("🎉 成功同步另一半的評分數據！");
      } catch (e) {
        showToast("❌ 代碼格式不正確，請確認複製了完整的 EASONSYNC 訊息");
      }
    }

    function closeModal() {
      document.getElementById("syncModal").classList.add("hidden");
    }

    // =========================================================================
    // 10. 示範數據、備份匯出與清空重置
    // =========================================================================
    function loadDemoData() {
      initRatingsStructure();
      const hotSessions = [26, 19, 13, 11, 6, 25, 5, 8, 24, 21, 9, 10];
      hotSessions.forEach(function(sNo, idx) {
        const s = OFFICIAL_26_SESSIONS.find(function(x) { return x.sessionNo === sNo; });
        if (!s) return;
        s.tracks.forEach(function(_, tIdx) {
          const hPool = idx < 4 ? ["god", "god", "good", "good", "normal"] : ["god", "good", "normal", "normal", "unknown"];
          const wPool = idx < 5 ? ["god", "good", "good", "normal", "god"] : ["good", "normal", "normal", "unknown", "unknown"];
          appState.ratings[sNo][tIdx] = {
            h: hPool[(tIdx + sNo) % hPool.length],
            w: wPool[(tIdx * 2 + sNo) % wPool.length]
          };
        });
      });
      saveToStorage();
      renderCards();
      recalculateScores();
      showToast("✨ 已載入 12 場熱門示範評分！可查看 Top 10 排行榜");
    }

    function exportJSONFile() {
      saveToStorage();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const a = document.createElement("a");
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "eason_2026_ratings.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast("已下載 JSON 備份檔案");
    }

    function resetAllData() {
      document.getElementById("modalTitle").innerText = "🗑️ 確認清空所有評分";
      document.getElementById("modalDesc").innerText = "確定要清空所有已打的分數並還原初始狀態嗎？";
      document.getElementById("modalTextarea").classList.add("hidden");
      document.getElementById("modalActions").innerHTML =
        '<button type="button" class="btn" onclick="closeModal()">取消</button>' +
        '<button type="button" class="btn btn-rose" onclick="confirmResetAllData()">確定清空全部</button>';
      document.getElementById("syncModal").classList.remove("hidden");
    }

    function confirmResetAllData() {
      safeRemoveStorage(STORAGE_KEY);
      appState = {
        wifeWeight: 70,
        husbandWeight: 30,
        scoreConfig: {
          god: DEFAULT_SCORE_CONFIG.god,
          good: DEFAULT_SCORE_CONFIG.good,
          normal: DEFAULT_SCORE_CONFIG.normal,
          unknown: DEFAULT_SCORE_CONFIG.unknown
        },
        ratings: {}
      };
      expandedSessions = new Set([1, 26]);
      initRatingsStructure();
      syncControlsUI();
      renderCards();
      recalculateScores();
      closeModal();
      showToast("已清空所有評分記錄");
    }

    function initApp() {
      initRatingsStructure();
      const saved = safeGetStorage(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.wifeWeight !== undefined) {
            appState.wifeWeight = Number(parsed.wifeWeight);
            appState.husbandWeight = 100 - appState.wifeWeight;
          }
          if (parsed.scoreConfig) {
            appState.scoreConfig = {
              god: parsed.scoreConfig.god ?? DEFAULT_SCORE_CONFIG.god,
              good: parsed.scoreConfig.good ?? DEFAULT_SCORE_CONFIG.good,
              normal: parsed.scoreConfig.normal ?? DEFAULT_SCORE_CONFIG.normal,
              unknown: parsed.scoreConfig.unknown ?? DEFAULT_SCORE_CONFIG.unknown
            };
          }
          if (parsed.ratings) appState.ratings = parsed.ratings;
          initRatingsStructure();
        } catch (e) {}
      }

      try {
        if (window.location.hash && window.location.hash.indexOf("#data=") === 0) {
          const raw = window.location.hash.replace("#data=", "").trim();
          unpackSyncString(raw, true);
          saveToStorage();
          try { history.replaceState(null, "", window.location.pathname + window.location.search); } catch (err) {}
          setTimeout(function() { showToast("🎉 已成功從分享連結同步評分數據！"); }, 300);
        }
      } catch (e) {}

      syncControlsUI();
      renderCards();
      recalculateScores();
    }

    // 立即安全啟動應用程式
    try {
      initApp();
    } catch (err) {
      console.error("初始化錯誤:", err);
    }
  </script>
</body>
</html>

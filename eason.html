<!DOCTYPE html>
<html lang="zh-HK">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eason 2026-2027 演唱錄音會 26場全曲目決策器 (Wiki全曲庫版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    .star-btn { transition: transform 0.15s ease, color 0.15s ease; }
    .star-btn:active { transform: scale(1.35); }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 28px; height: 28px; border-radius: 50%;
      background: #ec4899; cursor: pointer; border: 3px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .custom-scroll::-webkit-scrollbar { height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen text-base sm:text-lg pb-32">

  <!-- 頂部吸頂導航 -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3.5 shadow-xl">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center text-white shadow-lg shrink-0">
          <i class="fa-solid fa-compact-disc text-2xl animate-spin" style="animation-duration: 9s;"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-2xl font-black text-white leading-tight">Eason 2026-2027 錄音會選場</h1>
          <p class="text-xs sm:text-sm text-slate-400 font-medium">Wiki 完整曲目庫 · 官方 26 場大碟重錄全集</p>
        </div>
      </div>
      
      <!-- 方案 A 同步按鈕組 -->
      <div class="flex items-center gap-2">
        <button onclick="importSyncCodeModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs sm:text-sm text-slate-200 flex items-center gap-1.5 border border-slate-700 shadow-sm active:scale-95 transition">
          <i class="fa-solid fa-file-import text-amber-400 text-base"></i>
          <span class="font-bold">貼上代碼</span>
        </button>
        <button onclick="generateWhatsAppShare()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs sm:text-sm font-bold text-white flex items-center gap-2 shadow-md active:scale-95 transition">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span>WhatsApp 接力</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- 夫妻話事權重調配板 -->
    <section class="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 shadow-md space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 text-base sm:text-lg font-black text-white">
          <i class="fa-solid fa-scale-balanced text-amber-400 text-xl"></i>
          <span>話事權重調配 (夫妻佔比)</span>
        </div>
        <div class="flex items-center gap-1.5 bg-slate-800/80 p-1.5 rounded-2xl text-xs sm:text-sm font-bold">
          <button onclick="setWeightPreset(50)" class="px-3 py-1.5 rounded-xl hover:bg-slate-700 text-slate-300 transition">平權 50:50</button>
          <button onclick="setWeightPreset(70)" class="px-3 py-1.5 rounded-xl bg-pink-900/80 text-pink-200 border border-pink-700/60 transition">求生 70:30</button>
          <button onclick="setWeightPreset(100)" class="px-3 py-1.5 rounded-xl hover:bg-slate-700 text-slate-300 transition">老婆全權</button>
          <button onclick="setWeightPreset(20)" class="px-3 py-1.5 rounded-xl hover:bg-slate-700 text-slate-300 transition">老公 80%</button>
        </div>
      </div>

      <div class="space-y-3 pt-1">
        <div class="flex justify-between items-center text-sm sm:text-base font-bold">
          <span class="text-blue-400 flex items-center gap-1.5">
            <i class="fa-solid fa-mars text-lg"></i> 老公權重: <span id="husbandWeightText" class="text-xl font-black">30</span>%
          </span>
          <span class="text-pink-400 flex items-center gap-1.5">
            <i class="fa-solid fa-venus text-lg"></i> 老婆權重: <span id="wifeWeightText" class="text-xl font-black">70</span>%
          </span>
        </div>
        <input id="weightSlider" type="range" min="0" max="100" value="70" oninput="updateWeight(this.value)"
               class="w-full h-3 bg-slate-800 rounded-lg appearance-none cursor-pointer slider">
        <p class="text-xs sm:text-sm text-slate-400 text-center font-medium">
          💡 避雷保護：若任一方打出 1~2 分或標註「跳過」，系統將自動扣除 18 分避雷罰分，防止抽中悶場。
        </p>
      </div>
    </section>

    <!-- Top 10 首選推薦榜 -->
    <section class="bg-gradient-to-br from-indigo-950/70 via-slate-900 to-slate-900 border-2 border-indigo-900/60 rounded-3xl p-5 sm:p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b border-indigo-900/40 pb-3">
        <h2 class="text-base sm:text-xl font-black text-indigo-300 flex items-center gap-2">
          <i class="fa-solid fa-trophy text-amber-400 text-xl"></i> 當前最佳場次推薦 Top 10
        </h2>
        <span class="text-xs sm:text-sm font-semibold text-slate-400" id="totalRatedCount">已評分 0 / 26 場</span>
      </div>
      
      <div id="topRecommendations" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
        <!-- 動態渲染 Top 10 -->
      </div>
    </section>

    <!-- 搜尋與場次月份過濾 -->
    <section class="space-y-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-base"></i>
        <input type="text" id="songSearchInput" oninput="handleSearch(this.value)"
               placeholder="🔍 搜尋想聽的歌或專輯（如：陀飛輪、浮誇、1874、苦瓜、十年、黑擇明）..."
               class="w-full pl-11 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-2xl text-base text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition shadow-inner">
      </div>

      <div class="flex items-center gap-2 overflow-x-auto pb-1 custom-scroll text-sm sm:text-base font-bold">
        <button onclick="filterMonth('all')" id="tab-all" class="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 shrink-0 shadow-md">全部 26 場</button>
        <button onclick="filterMonth('2026-12')" id="tab-2026-12" class="px-4 py-2 rounded-xl bg-slate-900 text-slate-300 hover:bg-slate-800 shrink-0 border border-slate-800">2026年12月 (10場)</button>
        <button onclick="filterMonth('2027-01')" id="tab-2027-01" class="px-4 py-2 rounded-xl bg-slate-900 text-slate-300 hover:bg-slate-800 shrink-0 border border-slate-800">2027年1月 (10場)</button>
        <button onclick="filterMonth('2027-02')" id="tab-2027-02" class="px-4 py-2 rounded-xl bg-slate-900 text-slate-300 hover:bg-slate-800 shrink-0 border border-slate-800">2027年2月 (6場尾場)</button>
      </div>
    </section>

    <!-- 專輯場次列表區 -->
    <div class="flex items-center justify-between pt-2">
      <h2 class="text-lg sm:text-xl font-black text-white flex items-center gap-2">
        <i class="fa-solid fa-music text-rose-400"></i> 26 場完整打分表
      </h2>
      <div class="flex items-center gap-3 text-sm font-semibold">
        <button onclick="toggleAllTracks(true)" class="text-slate-400 hover:text-amber-400 transition">全部展開</button>
        <span class="text-slate-700">|</span>
        <button onclick="toggleAllTracks(false)" class="text-slate-400 hover:text-amber-400 transition">全部收起</button>
      </div>
    </div>

    <div id="albumListContainer" class="space-y-4">
      <!-- 渲染 26 場完整卡片 -->
    </div>

    <!-- 底部操作區 -->
    <div class="pt-6 flex justify-between items-center text-sm text-slate-500">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-shield-halved text-emerald-500"></i>

      </div>

    let currentMonthFilter = 'all';
    let searchQuery = '';
    let appState = {
      wifeWeight: 70,
      husbandWeight: 30,
      ratings: {}
    };

    function initRatings() {
      OFFICIAL_26_SESSIONS.forEach(s => {
        if (!appState.ratings[s.sessionNo]) {
          appState.ratings[s.sessionNo] = { hOverall: 0, wOverall: 0, tracks: {} };
          s.tracks.forEach(t => {
            appState.ratings[s.sessionNo].tracks[t] = { h: 0, w: 0 };
          });
        }
      });
    }

    // 採用高壓縮率序列化，防止 URL 過長
    function packSyncData() {
      const compact = {
        ww: appState.wifeWeight,
        hw: appState.husbandWeight,
        r: {}
      };
      for (const id in appState.ratings) {
        const item = appState.ratings[id];
        const trk = {};
        let hasTrk = false;
        if (item.tracks) {
          for (const t in item.tracks) {
            if (item.tracks[t].h > 0 || item.tracks[t].w > 0) {
              trk[t] = { h: item.tracks[t].h || 0, w: item.tracks[t].w || 0 };
              hasTrk = true;
            }
          }
        }
        if (item.hOverall > 0 || item.wOverall > 0 || hasTrk) {
          compact.r[id] = {
            h: item.hOverall || 0,
            w: item.wOverall || 0,
            t: trk
          };
        }
      }
      return btoa(unescape(encodeURIComponent(JSON.stringify(compact))));
    }

    function unpackSyncData(rawCode) {
      const parsed = JSON.parse(decodeURIComponent(escape(atob(rawCode))));
      initRatings();
      if (parsed.ww !== undefined) {
        appState.wifeWeight = parsed.ww;
        appState.husbandWeight = parsed.hw;
        for (const sNo in parsed.r) {
          if (appState.ratings[sNo]) {
            appState.ratings[sNo].hOverall = parsed.r[sNo].h || 0;
            appState.ratings[sNo].wOverall = parsed.r[sNo].w || 0;
            if (parsed.r[sNo].t) {
              for (const t in parsed.r[sNo].t) {
                if (appState.ratings[sNo].tracks[t]) {
                  appState.ratings[sNo].tracks[t] = parsed.r[sNo].t[t];
                }
              }
            }
          }
        }
      } else if (parsed.ratings) {
        // 向下兼容舊格式
        OFFICIAL_26_SESSIONS.forEach(s => {
          if (parsed.ratings[s.sessionNo]) {
            appState.ratings[s.sessionNo].hOverall = parsed.ratings[s.sessionNo].hOverall || 0;
            appState.ratings[s.sessionNo].wOverall = parsed.ratings[s.sessionNo].wOverall || 0;
            s.tracks.forEach(t => {
              if (parsed.ratings[s.sessionNo].tracks && parsed.ratings[s.sessionNo].tracks[t]) {
                appState.ratings[s.sessionNo].tracks[t] = parsed.ratings[s.sessionNo].tracks[t];
              }
            });
          }
        });
      }
    }

    function loadInitialData() {
      initRatings();

      // 檢查 URL Hash
      if (window.location.hash.startsWith('#data=')) {
        try {
          const raw = window.location.hash.replace('#data=', '');
          unpackSyncData(raw);
          saveToStorage();
          window.location.hash = '';
          alert('🎉 成功從分享連結同步夫妻打分數據！');
        } catch(e) {
          console.error("無法解析 URL Hash", e);
        }
      } else {
        const saved = localStorage.getItem('eason_recording_sessions_26_wiki');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            appState.wifeWeight = parsed.wifeWeight ?? 70;
            appState.husbandWeight = parsed.husbandWeight ?? 30;
            appState.ratings = parsed.ratings ?? {};
          } catch(e) {}
        }
      }

      initRatings();
      document.getElementById('weightSlider').value = appState.wifeWeight;
      updateWeightDisplay();
      renderCards();
      recalculateScores();
    }

    function saveToStorage() {
      localStorage.setItem('eason_recording_sessions_26_wiki', JSON.stringify(appState));
    }

    function updateWeight(val) {
      appState.wifeWeight = parseInt(val, 10);
      appState.husbandWeight = 100 - appState.wifeWeight;
      updateWeightDisplay();
      saveToStorage();
      recalculateScores();
    }

    function setWeightPreset(wifeVal) {
      document.getElementById('weightSlider').value = wifeVal;
      updateWeight(wifeVal);
    }

    function updateWeightDisplay() {
      document.getElementById('wifeWeightText').innerText = appState.wifeWeight;
      document.getElementById('husbandWeightText').innerText = appState.husbandWeight;
    }

    function filterMonth(month) {
      currentMonthFilter = month;
      ['all', '2026-12', '2027-01', '2027-02'].forEach(m => {
        const el = document.getElementById(`tab-${m}`);
        if (!el) return;
        if (m === month) {
          el.className = "px-4 py-2 rounded-xl bg-amber-500 text-slate-950 font-black shrink-0 shadow-md";
        } else {
          el.className = "px-4 py-2 rounded-xl bg-slate-900 text-slate-300 hover:bg-slate-800 shrink-0 border border-slate-800 font-bold";
        }
      });
      renderCards();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();

    function setOverallScore(sessionNo, role, score) {
      const cur = appState.ratings[sessionNo][role + 'Overall'];
      appState.ratings[sessionNo][role + 'Overall'] = (cur === score) ? 0 : score;
      saveToStorage();
      renderStarUI(sessionNo);
      recalculateScores();
    }

    function setTrackScore(sessionNo, trackName, role, score) {
      const cur = appState.ratings[sessionNo].tracks[trackName][role];
      appState.ratings[sessionNo].tracks[trackName][role] = (cur === score) ? 0 : score;

      const s = OFFICIAL_26_SESSIONS.find(x => x.sessionNo === sessionNo);
      const scores = s.tracks.map(t => appState.ratings[sessionNo].tracks[t][role]).filter(v => v > 0);
      if (scores.length > 0) {
        appState.ratings[sessionNo][role + 'Overall'] = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
      }

      saveToStorage();
      renderStarUI(sessionNo);
      renderTrackUI(sessionNo, trackName);
      recalculateScores();
    }

    function calculateMetrics(sessionNo) {
      const r = appState.ratings[sessionNo];
      if (!r) return { isRated: false, final100: 0, thunder: false };

      const h = r.hOverall || 0;
      const w = r.wOverall || 0;

      let thunder = false;
      let thunderReason = [];
      if (h > 0 && h <= 2) { thunder = true; thunderReason.push('老公踩雷'); }
      if (w > 0 && w <= 2) { thunder = true; thunderReason.push('老婆踩雷'); }

      const s = OFFICIAL_26_SESSIONS.find(x => x.sessionNo === sessionNo);
      if (s) {
        s.tracks.forEach(t => {
          const ts = r.tracks[t];
          if (ts && (ts.h === 1 || ts.w === 1)) {
            thunder = true;
            if (!thunderReason.includes('曲目有雷')) thunderReason.push(`「${t}」被標跳過`);
          }
        });
      }

      let weightedBase = (h * (appState.husbandWeight / 100)) + (w * (appState.wifeWeight / 100));
      let final100 = weightedBase * 20;

      if (thunder && final100 > 0) {
        final100 = Math.max(10, final100 - 18);
      }

      return {
        h, w,
        final100: (h > 0 || w > 0) ? Math.round(final100) : 0,
        thunder,
        thunderReason: thunderReason.join(' · '),
        isRated: (h > 0 || w > 0)
      };
    }

    function recalculateScores() {
      const results = OFFICIAL_26_SESSIONS.map(s => ({
        ...s,
        metrics: calculateMetrics(s.sessionNo)
      }));

      const ratedList = results.filter(r => r.metrics.isRated).sort((a, b) => b.metrics.final100 - a.metrics.final100);
      document.getElementById('totalRatedCount').innerText = `已評分 ${ratedList.length} / 26 場`;

      const topBox = document.getElementById('topRecommendations');

        topBox.innerHTML = `

        const top10 = ratedList.slice(0, 10);

          const rank = idx + 1;

            borderClass = 'border border-slate-800 hover:border-slate-700';
          }

          return `
            <div class="p-3.5 sm:p-4 rounded-2xl ${borderClass} ${bgClass} flex flex-col justify-between transition hover:-translate-y-0.5">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  ${rankBadge}

                    ${item.metrics.final100}<span class="text-xs text-slate-400 font-normal ml-0.5">分</span>
                  </span>
                </div>
                <h4 class="font-black text-white text-base sm:text-lg truncate leading-snug">${item.name}</h4>
                <div class="flex items-center gap-2 mt-1 text-xs text-slate-300 font-semibold">

                </div>
              </div>
              <div class="mt-2.5 pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs sm:text-sm font-bold">
                <span class="text-blue-400">🤵 ${item.metrics.h || '-'}★</span>
                <span class="text-pink-400">👰 ${item.metrics.w || '-'}★</span>
                ${item.metrics.thunder ? '<span class="text-rose-400 text-xs">⚠️ 有雷</span>' : '<span class="text-emerald-400 text-xs">✨ 合拍</span>'}
              </div>
            </div>
          `;
        }).join('');
      }

      OFFICIAL_26_SESSIONS.forEach(s => renderHeaderStats(s.sessionNo));
    }

          const matchDate = s.dateText.toLowerCase().includes(searchQuery);

          if (!matchAlbum && !matchDate && !matchSong) return false;
        }
        return true;
      });

      if (filtered.length === 0) {

              <div class="flex flex-col items-center">
                <span class="text-xs sm:text-sm font-black text-blue-400 mb-1">🤵 老公打分</span>

                    <button onclick="setOverallScore(${s.sessionNo}, 'w', ${star})" class="star-btn text-2xl sm:text-3xl text-slate-700 hover:text-amber-400 p-0.5">

                  `).join('')}

              <span class="flex gap-16 sm:gap-24 pr-2">

            ${s.tracks.map(t => {
              const isHighlight = searchQuery && t.toLowerCase().includes(searchQuery);
              return `
                <div class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-900/60 transition ${isHighlight ? 'bg-amber-950/40 border border-amber-600/40' : ''}">
                  <span class="text-sm sm:text-base font-semibold text-slate-100 truncate pr-2">

                  <div class="flex items-center gap-6 sm:gap-12 shrink-0">
                    <div class="flex gap-1.5" id="track-btn-${s.sessionNo}-${encodeURIComponent(t)}-h">${renderPills(s.sessionNo, t, 'h')}</div>
                    <div class="flex gap-1.5" id="track-btn-${s.sessionNo}-${encodeURIComponent(t)}-w">${renderPills(s.sessionNo, t, 'w')}</div>

      filtered.forEach(s => renderStarUI(s.sessionNo));

    function renderPills(sessionNo, track, role) {
      const cur = (appState.ratings[sessionNo] && appState.ratings[sessionNo].tracks[track]) ? appState.ratings[sessionNo].tracks[track][role] : 0;
      return [
        { v: 5, icon: '🔥', label: '神曲' },
        { v: 3, icon: '☕', label: '普通' },
        { v: 1, icon: '❌', label: '跳過' }
      ].map(opt => {
        const active = cur === opt.v;
        let btnCls = 'bg-slate-800 text-slate-400 border border-slate-700/70';
        if (active) {
          btnCls = role === 'h' ? 'bg-blue-600 text-white font-black shadow-md border-blue-400' : 'bg-pink-600 text-white font-black shadow-md border-pink-400';
        }
        return `
          <button onclick="setTrackScore(${sessionNo}, '${track}', '${role}', ${opt.v})"
                  title="${opt.label}"
                  class="w-10 h-8 sm:w-12 sm:h-9 rounded-xl flex items-center justify-center text-xs sm:text-sm transition active:scale-90 ${btnCls}">
            ${opt.icon}
          </button>
        `;
      }).join('');
    }

    function renderStarUI(sessionNo) {
      const r = appState.ratings[sessionNo];
      if (!r) return;
      ['h', 'w'].forEach(role => {
        const val = r[role + 'Overall'] || 0;
        const box = document.getElementById(`stars-${role}-${sessionNo}`);
        if (!box) return;
        box.querySelectorAll('button').forEach((btn, idx) => {
          btn.className = `star-btn text-2xl sm:text-3xl p-0.5 ${idx < val ? 'text-amber-400' : 'text-slate-700'}`;
        });
      });
    }

    function renderTrackUI(sessionNo, track) {
      ['h', 'w'].forEach(role => {
        const el = document.getElementById(`track-btn-${sessionNo}-${encodeURIComponent(track)}-${role}`);
        if (el) el.innerHTML = renderPills(sessionNo, track, role);
      });
    }

    function renderHeaderStats(sessionNo) {
      const metrics = calculateMetrics(sessionNo);
      const badge = document.getElementById(`badge-score-${sessionNo}`);
      const thunderTag = document.getElementById(`thunder-tag-${sessionNo}`);
      if (!badge) return;

      if (!metrics.isRated) {
        badge.innerHTML = `<span class="text-xs sm:text-sm text-slate-500 font-bold">未打分</span>`;
        if (thunderTag) thunderTag.innerHTML = '';
        return;
      }

      badge.innerHTML = `
        <div class="text-xl sm:text-2xl font-black ${metrics.thunder ? 'text-rose-400' : 'text-emerald-400'}">
          ${metrics.final100}<span class="text-xs text-slate-400 font-normal">分</span>
        </div>
      `;

      if (thunderTag) {
        thunderTag.innerHTML = metrics.thunder
          ? `<span class="text-rose-400 font-bold flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation"></i> ${metrics.thunderReason}</span>`
          : `<span class="text-emerald-400 font-bold flex items-center gap-1.5"><i class="fa-solid fa-circle-check"></i> 意見合拍</span>`;
      }
    }

    function toggleTracks(sessionNo) {
      const wrapper = document.getElementById(`tracks-wrapper-${sessionNo}`);
      const icon = document.getElementById(`toggle-icon-${sessionNo}`);
      if (wrapper && icon) {
        wrapper.classList.toggle('hidden');
        icon.classList.toggle('rotate-180');
      }
    }

    function toggleAllTracks(show) {
      OFFICIAL_26_SESSIONS.forEach(s => {
        const wrapper = document.getElementById(`tracks-wrapper-${s.sessionNo}`);
        const icon = document.getElementById(`toggle-icon-${s.sessionNo}`);
        if (wrapper && icon) {
          if (show) { wrapper.classList.remove('hidden'); icon.classList.add('rotate-180'); }
          else { wrapper.classList.add('hidden'); icon.classList.remove('rotate-180'); }
        }
      });
    }

    function generateWhatsAppShare() {
      saveToStorage();
      const codeStr = packSyncData();

      const rated = OFFICIAL_26_SESSIONS
        .map(s => ({ name: s.name, dateText: s.dateText, score: appState.ratings[s.sessionNo]?.hOverall || 0 }))
        .filter(s => s.score > 0)
        .sort((a, b) => b.score - a.score);

      const topText = rated.length > 0 ? rated.slice(0, 3).map(x => `${x.name}(${x.score}★)`).join('、') : '尚未評分';

      let shareUrl = "";
      if (window.location.protocol.startsWith('http')) {
        shareUrl = `\n🔗 點擊專屬連結直達接力打分:\n${window.location.origin}${window.location.pathname}#data=${codeStr}\n`;
      }

      const msg = `🎵【Eason 2026-2027 錄音會 26場選場接力】🎵\n🤵 老公已完成打分！目前心水推薦：${topText}。\n輪到老婆打分啦！查看即時 Top 10！${shareUrl}\n📋 接力同步代碼（若使用本機檔案請全選複製此代碼）：\nEASONSYNC:${codeStr}\n`;

      navigator.clipboard.writeText(msg).then(() => {
        alert("✅ 接力代碼已成功複製！\n\n直接在 WhatsApp 貼上傳給老婆！老婆直接點開連結或按「貼上代碼」，即可無縫載入你的全部打分並即時計算夫妻 Top 10！");
      }).catch(() => {
        prompt("請手動複製以下內容發送給老婆：", msg);
      });
    }

    function importSyncCodeModal() {
      const input = prompt("請貼上老公從 WhatsApp 發給你的接力代碼或文字：");
      if (!input) return;

      try {
        let code = input.trim();
        if (code.includes('EASONSYNC:')) {
          code = code.split('EASONSYNC:')[1].split('\n')[0].trim();
        } else if (code.includes('#data=')) {
          code = code.split('#data=')[1].trim();
        }

        unpackSyncData(code);
        document.getElementById('weightSlider').value = appState.wifeWeight;
        updateWeightDisplay();
        saveToStorage();
        renderCards();
        recalculateScores();
        alert("🎉 成功同步老公的 26 場評分！現在你可以繼續給老婆評分了！");
      } catch(e) {
        alert("❌ 無法識別代碼，請確認複製了完整的 EASONSYNC 代碼！");
      }
    }

    function resetData() {
      if (confirm("確定要清空所有已打的分數重來？")) {
        localStorage.removeItem('eason_recording_sessions_26_wiki');
        appState.wifeWeight = 70;
        appState.husbandWeight = 30;
        appState.ratings = {};
        initRatings();
        document.getElementById('weightSlider').value = 70;
        updateWeightDisplay();
        renderCards();
        recalculateScores();
      }
    }

    window.addEventListener('DOMContentLoaded', loadInitialData);
  </script>
</body>
</html>
